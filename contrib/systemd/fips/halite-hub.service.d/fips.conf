# The FIPS deployment of SPEC 27.4: the -fips artifact, in FIPS mode,
# with the mode stated by the unit rather than inherited.
#
# Drop this in as /etc/systemd/system/halite-hub.service.d/fips.conf. It
# overrides only the two lines that differ, so the unit it extends stays
# the single place the rest of the service is described.
#
# The empty ExecStart= is required: without it systemd appends a second
# command rather than replacing the first.

[Service]
Environment=GODEBUG=fips140=on
ExecStart=
ExecStart=/usr/local/bin/halite-hub-fips serve --config /etc/halite/hub.yaml
