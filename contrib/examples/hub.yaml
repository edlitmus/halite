# halite-hub.
#
# `halite-hub serve` runs the control plane: enrollment, the key
# lifecycle, the subscribe stream, remote execution, the file server,
# pillar, RBAC, batching, the event bus, runners, orchestration, the
# reactor, the mine, and metrics. `files` (the push in the other
# direction from salt-cp) and `ssh` are not built, and say so.

# The one TCP port of SPEC section 6.1. There is no plaintext mode.
listen: :4510

# The enrollment CA and the hub's own serving certificate. `serve`
# creates the CA on first run and says so.
pki_dir: /usr/local/etc/halite/pki
# The key store lives under here, in keys/. Losing it means the fleet
# enrols again, so it is durable state and not cache.
state_dir: /var/db/halite

# manual, token, or attested. There is deliberately no auto_accept:
# `halite-hub keys token create --ttl 1h` is the automatic path, and
# unlike auto_accept it expires, is scoped, and records what it let in.
# SPEC section 7.3.
enrollment_mode: manual

# Issued certificates last this long; a node renews at half of it.
certificate_lifetime: 2160h
# ecdsa-p256 by default. ecdsa-p384 for a longer key.
key_algorithm: ecdsa-p256

# The tree this hub serves. It must not hold state_dir, cache_dir, or
# pki_dir: `serve` refuses to start on an overlap, because serving the
# job cache serves every return in the estate to every node.
file_roots:
  base:
    - /srv/halite/states
pillar_roots:
  base:
    - /srv/halite/pillar

# Which grains a pillar top file may target on. SPEC section 12.4: a node
# controls its own grains, so an unlisted one is refused by name rather
# than silently matching nothing.
pillar_trusted_grains:
  - nodename
  - os_family

# smart, recurse, aggregate, or overwrite.
pillar_source_merging_strategy: smart

# Deny by default. Every rule is an explicit grant, and an absent file
# authorizes nothing rather than everything. SPEC section 23.5.
#
# `halite-hub keys operator create <name> --admin` writes a starting
# one. `halite-hub policy test` evaluates a request against it, which
# belongs in CI.
policy: /usr/local/etc/halite/policy.yaml

# How long a job and its returns are kept, and the ceiling on the whole
# store. Whichever binds first wins, and the hub enforces both.
job_cache_retention: 720h
job_cache_max_size: 10737418240

# Nodegroups are named target expressions, checked at load: a cycle or a
# reference to a group that does not exist is a configuration error
# rather than a surprise when a job is dispatched.
# nodegroups:
#   web: 'G@os:FreeBSD and web*'


# The event bus of SPEC section 17. Durable and segmented, so a
# subscriber resumes from an offset and a reactor restart is lossless.
# Retention is by age and by total size, whichever binds first.
event_retention: 720h
event_max_size: 4294967296

# Additionally emit each event under its salt/ spelling, for a consumer
# that cannot be changed at the same time as the estate.
event_tag_compat: false

# Prometheus exposition at /v1/metrics, behind an operator certificate
# and the runner grant `metrics.show`. `halite-hub metrics` reads it.
# SPEC 26.2.
metrics: true

# The git file server, SPEC 13.3. Through the system `git` binary, so
# the estate gets its operating system's git patching cadence.
#
# A branch becomes an environment; gitfs_base names the one that becomes
# `base`. Roots come first, so a local directory shadows a repository
# for the same path.
#
# With gitfs_verify_signatures on, a ref whose tip is not signed by a
# key in gitfs_keyring is not served — not logged and served anyway.
#
# fileserver_backend:
#   - roots
#   - git
# gitfs_remotes:
#   - url: https://git.example/estate/salt.git
#     name: estate
#     root: states
# gitfs_base: main
# gitfs_update_interval: 5m
# gitfs_verify_signatures: true
# gitfs_keyring: /usr/local/etc/halite/gitfs-keyring

# The S3 file server, SPEC 13.4. SigV4 is signed in-house; there is no
# AWS SDK.
#
# The first path segment after the prefix is the environment, so
# states/base/top.sls serves top.sls in `base`. Prefer a role to a key,
# and the file form to the inline one.
#
# fileserver_backend:
#   - roots
#   - s3
# s3_buckets:
#   - name: estate
#     prefix: states/
# s3_region: eu-west-1
# s3_role_arn: arn:aws:iam::123456789012:role/halite
# s3_update_interval: 5m

# Ship the whole event stream to a returner, which SPEC 20.3 calls the
# recommended path to a SIEM. It resumes from a bus offset, so a
# receiver that was unreachable for an hour catches up rather than
# leaving an hour-shaped hole in the audit trail.
#
# event_return: syslog
# event_return_tags: 'halite/job/**,halite/state/**'
# returner_syslog_address: siem.example:6514
# returner_syslog_tls: true

log_level: info
log_format: json
