# halite-api.
#
# The estate's directory, SPEC 23.3. Reached through /v1/login with
# `eauth: ldap`, because unlike OIDC it is a username and a password.
#
# There is no plaintext mode: ldap_tls is `ldaps` or `starttls`. The
# username goes into the filter escaped and never into a DN.
#
# ldap_address: dir.example:636
# ldap_tls: ldaps
# ldap_ca_file: /usr/local/etc/halite/internal-ca.pem
# ldap_bind_dn: cn=halite,ou=services,dc=example,dc=com
# ldap_bind_password_file: /usr/local/etc/halite/ldap.secret
# ldap_user_base_dn: ou=people,dc=example,dc=com
# ldap_user_filter: '(uid=%s)'
# ldap_role_map:
#   platform: [operator]

# The identity provider of SPEC 23.4, the recommended way to
# authenticate an operator. Empty leaves it off and local accounts are
# the only way in.
#
# A group with no entry in oidc_role_map grants nothing: the provider's
# directory is not this estate's authorization model. Setting an issuer
# with no map is refused at startup rather than letting every operator
# discover it one at a time.
#
# oidc_issuer: https://idp.example/realms/estate
# oidc_client_id: halite
# oidc_client_secret_file: /usr/local/etc/halite/oidc.secret
# oidc_redirect_url: https://api.example:4511/v1/login/oidc/callback
# oidc_ca_file: /usr/local/etc/halite/internal-ca.pem
# oidc_groups_claim: groups
# oidc_role_map:
#   platform-team: [operator]

# Prometheus exposition at /v1/metrics, authenticated like every other
# endpoint. This service is the estate's scrape target: it answers with
# the hub's metrics merged into its own, because the hub speaks its own
# protocol over mutual TLS and no scraper can reach it. SPEC 26.2.
# Where the token store lives. Named explicitly because the systemd unit
# runs with StateDirectory=halite-api and ProtectSystem=strict, which
# makes everything outside it read-only: a service left on the built-in
# default of <state dir> could not write a token at all.
state_dir: /var/lib/halite-api

metrics: true

log_level: info
log_format: json
