# The checks SPEC 4.2 says have teeth.
#
# "CI enforces it" is the specification's phrase for the dependency
# policy, and until now nothing did: every gate in this file existed as a
# make target or a Go test, and the only thing that ran them was a person
# deciding to. What that cost is measured rather than guessed at.
# `internal/builtin` did not compile on Linux for two weeks. The suite
# was red on Windows for a day over an assertion that cannot hold there.
# The race detector had been run on FreeBSD and on Linux, but only when
# somebody remembered, which is not often enough to catch a race that
# appears in one sweep out of three. Every one of those was found by
# hand, late, and none of them had to be.
#
# The jobs are split by make target rather than run as one `make check`,
# so a failure names the leg that failed instead of the word "check".
# Together they are `check` plus the two gates it deliberately leaves
# out: the Salt differential, which needs a container, and the
# reproducibility check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request cancels the first. The gates are long
# and the answer for a superseded commit is not worth the runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `check` has to work on a machine with no network, which is the same
  # machine a release is built on. The toolchain is the one thing CI
  # fetches, and it fetches the version go.mod pins rather than whatever
  # the runner image shipped.
  GOTOOLCHAIN: auto

jobs:
  # The fast gate. Formatting, vet, and the specification's own build
  # rules -- the lexicon of SPEC 2.3, the dependency allowlist of 4.2,
  # and the import restrictions of 25.3. Runs first because it is
  # seconds, and a tree that fails it should not occupy eight runners.
  policy:
    name: fmt, vet, policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The toolchain version, not go.mod's `go` directive.
          #
          # `go-version-file: go.mod` reads the `go` line, which is a
          # floor -- 1.26.0 -- and not the `toolchain` line, which is the
          # pin. So every job installed 1.26.0 from this action's own
          # source and then fetched 1.26.6 from proxy.golang.org through
          # GOTOOLCHAIN=auto, over the network, uncached, before a line of
          # this repository compiled. Twelve jobs a push, each carrying a
          # dependency nothing needed: one of them died in setup-go's own
          # `go env GOPATH` when that fetch failed.
          #
          # Naming the pin here installs it directly and leaves
          # GOTOOLCHAIN=auto with nothing to download. internal/buildpolicy
          # holds this version to go.mod's `toolchain` directive in both
          # directions, so the two cannot drift.
          go-version: "1.26.6"
          cache: true
      - run: make fmt-check
      - run: make vet
      - run: make policy

  # Every shipped target, built and vetted. `go build` does not compile
  # test files, so this runs vet too: that is what catches a test helper
  # that only exists on one platform, which is how internal/builtin's
  # 197 tests silently stopped running everywhere but Windows.
  build-all:
    name: build all targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The pin, not go.mod's floor. See the first setup-go step.
          go-version: "1.26.6"
          cache: true
      - run: make build-all

  # The suite, on every platform a hosted runner exists for.
  #
  # Windows is not a formality here. The first native run failed 80
  # tests across 12 packages, and three of those were defects on every
  # platform that only a system without unlink-while-open could show.
  #
  # macOS had never run the suite at all when it was added: DIVERGENCE
  # 4.x recorded it as compiling and nothing more, which is the exact
  # profile Windows had before it yielded four defects. It is also
  # arm64, so it is the first time this tree's tests have run on that
  # architecture anywhere.
  #
  # FreeBSD is not in this matrix because there is no runner to put it
  # on; it has a job of its own further down, in a virtual machine.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The pin, not go.mod's floor. See the first setup-go step.
          go-version: "1.26.6"
          cache: true

      - name: test (make)
        if: runner.os == 'Linux'
        run: make test

      # The same recipe, spelled out, because GNU make on Windows runs
      # recipes through cmd.exe unless it finds a POSIX sh, and this
      # Makefile's recipes are sh. Provisioning one is more moving parts
      # than the one line the `test` target actually is; if this ever
      # grows past a line, install a shell and call make instead.
      #
      # Kept honest by `make test`'s own definition: CGO_ENABLED=0, and
      # -count=1 because several audits here read the whole tree rather
      # than their own package, and the cache does not notice a file
      # that did not exist when the result was recorded.
      #
      # The standard account gets its own empty module cache, so a
      # toolchain that needs fetching would be fetched there rather than
      # found. Assert the runner already has the pinned one.
      - name: the runner's Go is the pinned toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: .github/toolchain-check.sh

      # Run as a standard account rather than the runner's
      # administrator: the suite asserts that a file it has denied
      # itself cannot be read, and an administrator reads it anyway. See
      # the script.
      #
      # `shell: powershell` rather than pwsh, because the local-account
      # cmdlets are native to Windows PowerShell and reaching them from
      # pwsh goes through a compatibility layer that is one more thing to
      # be flaky.
      - name: test (windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CGO_ENABLED: 0
        run: .github/run-as-standard-user.ps1 test -count=1 ./...

      # macOS does not go through make either, for a different reason
      # than Windows: Apple ships GNU Make 3.81, the last GPLv2 release,
      # and this Makefile uses `!=` shell assignment, which GNU make
      # gained in 4.0. `make test` there would not fail loudly — it
      # would misparse the version variables and carry on — so it is
      # not used. Installing a newer make through Homebrew is the
      # alternative, and it is more moving parts than the one line the
      # target expands to.
      - name: test (macos)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: 0
        run: go test -count=1 ./...

  # The race detector, on every change rather than when somebody
  # remembers. It has been run on FreeBSD and on Linux for a long time;
  # what it had never been is *frequent*, and the two races it found on
  # 2026-09-05 are both intermittent -- a data race on the hub's clock
  # that appears in roughly one sweep in three, and a test that loses
  # about one run in eight on Linux and had never lost on Windows. A
  # single green run says less than it looks like it does.
  #
  # Windows was the exception to "has been run": it had never run this
  # leg at all, because CGO_ENABLED=1 needs a compiler the image does
  # not put on PATH by default. macOS is the second, and it needs no
  # provisioning -- the image ships clang, and Go supports the detector
  # on darwin/arm64.
  #
  # `race` sets CGO_ENABLED=1 on purpose: the detector is unavailable
  # with cgo off, and a job that ran without it would report nothing it
  # had not first made true. That is why the Windows leg provisions a
  # compiler rather than skipping when it finds none -- a skipped leg
  # that says nothing is the failure this whole file exists to prevent.
  race:
    name: race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The pin, not go.mod's floor. See the first setup-go step.
          go-version: "1.26.6"
          cache: true

      - name: race (make)
        if: runner.os == 'Linux'
        run: make race

      # The runner image ships mingw-w64, but "ships it today" is not a
      # thing to depend on silently: assert a compiler, install one if
      # the image ever stops carrying it, and fail loudly if neither
      # works.
      - name: ensure a C compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null; then
            choco install mingw -y --no-progress
          fi
          gcc --version

      - name: the runner's Go is the pinned toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: .github/toolchain-check.sh

      - name: race (windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CGO_ENABLED: 1
        run: .github/run-as-standard-user.ps1 test -count=1 -race ./...

      # Asserted the same way the Windows leg's compiler is, for the
      # same reason: cgo silently off would run this whole job without
      # the detector and report a pass that checked nothing.
      - name: race (macos)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: 1
        run: |
          cc --version >/dev/null
          go test -count=1 -race ./...

  # FreeBSD, which is the development platform and had no automation at
  # all.
  #
  # It runs in a QEMU virtual machine on a Linux runner, because there
  # is no other way to get it here: GitHub hosts Ubuntu, Windows and
  # macOS, the runner agent is .NET so self-hosting is not a
  # straightforward answer either, and Cirrus CI — which ran native
  # FreeBSD and was what most projects used — stopped running jobs in
  # June 2026.
  #
  # **It is emulated, not accelerated.** GitHub's hosted runners expose
  # no /dev/kvm, so QEMU falls back to software translation. That is the
  # reason only the suite runs here and not the race detector: the
  # detector is already several times slower than a plain run, and the
  # product of the two multipliers is not a gate anybody would wait for.
  # FreeBSD is also the platform where the detector *has* been run by
  # hand for a long time, so it is the least severe of the three gaps to
  # leave open.
  #
  # If this proves too slow to sit in front of every pull request, the
  # honest change is to move it to a schedule and say so — a nightly
  # gate is a compromise, and this project's position is that a gate
  # which runs sometimes is not the same as a gate that runs. For a
  # platform whose alternative is no coverage at all, it is still the
  # better of the two.
  freebsd:
    name: test (freebsd)
    runs-on: ubuntu-24.04
    # Emulation makes the wall time hard to predict, and the default job
    # timeout is six hours. This bounds a hang without pretending to
    # know what a healthy run costs; the number moves once there is a
    # measurement behind it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start the virtual machine
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: freebsd
          version: '15.1'
          # The suite writes nothing the runner needs afterwards, and
          # syncing a Go build tree back out of an emulated VM is not
          # free.
          sync_files: runner-to-vm

      # Every step below runs inside the VM.
      #
      # The toolchain comes from go.dev rather than from pkg, and its
      # version is read out of go.mod rather than written here. `pkg
      # install go` gives whatever the ports tree has, which is a second
      # source of truth for a thing this project pins deliberately —
      # SPEC 4.3 wants the toolchain fixed, and a workflow naming its
      # own version would drift from the file that decides.
      - name: Install the pinned toolchain
        shell: cpa.sh {0}
        run: |
          set -e
          version=$(awk '/^toolchain /{print $2; exit}' go.mod)
          if [ -z "$version" ]; then
            echo "go.mod names no toolchain; this job reads it from there" >&2
            exit 1
          fi
          # Into $HOME rather than /usr/local: the VM's account is not
          # root, and asking for sudo would make this depend on how the
          # image is built rather than on anything about FreeBSD.
          #
          # Under `toolchain/` rather than straight into $HOME, because
          # the archive unpacks a directory called `go` and $HOME/go is
          # where GOPATH already points. Putting a toolchain there would
          # have it share a directory with the module cache it is about
          # to populate.
          mkdir -p "$HOME/toolchain"
          fetch -q -o /tmp/go.tar.gz "https://go.dev/dl/${version}.freebsd-amd64.tar.gz"
          tar -C "$HOME/toolchain" -xzf /tmp/go.tar.gz
          "$HOME/toolchain/go/bin/go" version

      # Through `make`, unlike the Windows and macOS legs. FreeBSD's
      # make is bmake, which is the dialect this Makefile was written
      # for -- `!=` is native there rather than a 4.0 feature Apple's
      # make predates. This is the one platform where CI runs the target
      # rather than a copy of what it expands to.
      - name: test
        shell: cpa.sh {0}
        run: |
          set -e
          export PATH="$HOME/toolchain/go/bin:$PATH"
          make test

  # The FIPS artifact set is a shipped deliverable, and a restriction
  # that only holds in the build nobody runs locally is a restriction
  # that breaks on the tag. The whole suite, with all cryptography
  # routed through the certified module.
  fips:
    name: fips-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The pin, not go.mod's floor. See the first setup-go step.
          go-version: "1.26.6"
          cache: true
      # fips-test builds with GOPROXY=off, and fetching a toolchain
      # needs the proxy. So if the runner's Go is older than the pinned
      # toolchain, the failure arrives offline and looks like a
      # dependency problem. Say what it is instead.
      - name: the runner's Go is the pinned toolchain
        run: .github/toolchain-check.sh
      - run: make fips-test

  # SPEC 31 calls this the primary correctness gate: the same tree
  # compiled by halite and by Salt, compared. It has always skipped
  # where Salt is absent, which is every machine this project is
  # developed on -- so the primary correctness gate was green by not
  # running. The container is what makes it a command.
  saltdiff:
    name: salt differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make saltdiff

  # Two builds of the same source on one machine, from two paths.
  #
  # This is not SPEC 4.3's two-builder check, which is on the tag and in
  # release.yml. It is the cheap half: a build that is not reproducible
  # from two paths on one machine will not be reproducible across two.
  repro:
    name: reproducible build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # `make release` stamps the commit through -buildvcs, and a
          # shallow clone with no tags makes `git describe` answer
          # differently than it will anywhere else.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # The pin, not go.mod's floor. See the first setup-go step.
          go-version: "1.26.6"
          cache: true
      - name: the runner's Go is the pinned toolchain
        run: .github/toolchain-check.sh
      - run: make repro
