name: Windows checkpoint 827
on:
  push:
    branches: [codex/827-windows-check]
permissions:
  contents: read
jobs:
  checkpoint:
    name: Checkpoint (${{ matrix.code }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        code: [fixed, baseline]
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Restore the previous read path while keeping the test diagnostics
        if: matrix.code == 'baseline'
        shell: bash
        run: git restore --source=HEAD~2 -- internal/hub/orchstore.go
      - name: Run the checkpoint repeatedly as a standard user
        shell: powershell
        run: .github/run-as-standard-user.ps1 test -v -count=100 -timeout=8m -run=^TestASignedStepIsRecordedPendingAndSignedBeforeItsJobIsSent$ ./internal/hub
