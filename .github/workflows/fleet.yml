# The modules that change a machine, driven against the real tools.
#
# # Why this is not part of CI
#
# It is destructive by design. The run holds a package, writes the
# debconf database, adds and removes an apt repository, and relinks
# /etc/localtime — in a container that is thrown away, which is what
# makes that acceptable and is also why it cannot share a job with
# anything else.
#
# And it does not gate a pull request. `zfscheck` set that precedent for
# the same reasons: it takes minutes, it needs Docker, and a failure here
# is worth a person reading rather than a merge button going grey. A
# module's dealings with `dpkg` do not change because somebody edited the
# YAML parser, so running it per push would mostly be running it for
# nothing — and a check that is usually irrelevant is a check people
# learn to skip.
#
# Nightly, then, plus on demand. `workflow_dispatch` is the one that
# matters in practice: after touching one of these modules, run it.
name: Fleet

on:
  schedule:
    # 04:00 UTC, which is after the working day everywhere this fleet is
    # and before the first person looks at anything.
    - cron: "0 4 * * *"
  workflow_dispatch:
  # On a change to the modules it drives or to the image itself, because
  # those are the pushes where the answer can actually differ.
  push:
    paths:
      - "internal/builtin/dpkg*.go"
      - "internal/builtin/debconf*.go"
      - "internal/builtin/pkgrepo*.go"
      - "internal/builtin/timezone*.go"
      - "internal/builtin/hostname*.go"
      - "internal/builtin/sysctl*.go"
      - "internal/builtin/apparmor*.go"
      - "internal/builtin/netplan*.go"
      - "internal/builtin/service*.go"
      - "internal/builtin/pkg*.go"
      # `quota` is here and `pam` and `openssl_cert` are not, and the
      # difference is what each needs to be driven. Their live tests
      # change nothing outside a directory the test owns, so they run in
      # the ordinary `test` job on every platform. `quota` needs a
      # filesystem that has quotas, which means root and the loop
      # driver, which means this workflow.
      - "internal/builtin/quota*.go"
      - "internal/dbus/**"
      - "internal/builtin/live_apparmor_test.go"
      - "internal/builtin/live_debian_test.go"
      - "internal/builtin/live_netplan_test.go"
      - "internal/builtin/live_pkg_test.go"
      - "internal/builtin/live_quota*_test.go"
      - "internal/builtin/live_service_test.go"
      - "internal/builtin/live_system_test.go"
      - "internal/builtin/evidence.go"
      - "contrib/docker/fleet/**"
      - ".github/workflows/fleet.yml"

permissions:
  contents: read

jobs:
  debian:
    name: debian (real dpkg, debconf, apt, tzdata)
    runs-on: ubuntu-24.04
    # Generous, because the first run of a changed image builds it and
    # the toolchain is fetched into an empty module cache. The run
    # itself is seconds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Built here rather than pulled, so that what runs is what the
      # tree says. An image from a registry is one more thing that can
      # drift from the repository that is supposed to describe it.
      - name: build the image
        run: docker build -t halite-fleet:bookworm contrib/docker/fleet

      # `make fleetcheck` is the same command a person runs, and running
      # the recipe rather than a copy of it is what stops the two
      # diverging. The image is already built above, so this step only
      # re-tags nothing and runs.
      - name: drive the modules
        run: make fleetcheck

      # What was actually established, in the log, whether or not the
      # job passed. The evidence table in internal/builtin/evidence.go
      # claims these modules have met their tools; this is where that
      # claim is either true today or visibly not.
      - name: what this established
        if: always()
        run: |
          echo "The modules driven here are declared Hardware in"
          echo "internal/builtin/evidence.go, and DIVERGENCE 5.35 records"
          echo "what that covers and what it does not. A failure means"
          echo "either a module changed or Debian did; both are worth"
          echo "reading rather than retrying."

  # `hostname` and `sysctl` on a machine rather than in an image.
  #
  # Neither can be done in a container and the reasons are different.
  # `sysctl` is the kernel, and a container shares the host's: /proc/sys
  # is read-only there, and a container that remounted it would be
  # writing to whoever's machine ran the test. `hostname` gets closer --
  # a container has its own UTS namespace, so the running name really
  # changes -- but Docker bind-mounts /etc/hostname, so the atomic
  # replace fails with `device or resource busy`, and `hostnamectl` is
  # not running, which is the branch a systemd node takes.
  #
  # A GitHub runner is a fresh virtual machine that is destroyed when the
  # job ends. Renaming it and moving one kernel parameter costs nothing,
  # and both are put back regardless.
  #
  # `netplan` rides along here rather than needing its own machine,
  # because the module never applies unless a declaration asks: the test
  # writes a file into /etc/netplan, has real `netplan generate` validate
  # it, reads it back through `netplan get`, and removes it. None of that
  # touches an interface, so the runner being reachable only over its one
  # NIC does not matter -- `netplan apply` is the path that would, and no
  # live test runs it (DIVERGENCE 5.38).
  #
  # `service` rides along too: a container has no running systemd for it
  # to speak D-Bus to, and a GitHub runner does. The test drives a
  # throwaway unit in /run/systemd/system that is attached to nothing
  # (DIVERGENCE 5.39).
  linux:
    name: linux (real kernel, hostname, apparmor, netplan, service, pkg, quota)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      # The aa-* tools are in `apparmor-utils`, which Ubuntu does not
      # install by default -- which is itself a fact the module is built
      # around: a node can be running AppArmor with no way to change a
      # mode on it. The parser and the kernel LSM are already here.
      - name: install the AppArmor tools
        run: sudo apt-get install -y --no-install-recommends apparmor-utils

      # The quota tools are a separate package everywhere, which is
      # itself the reason `quota.report` refuses by name rather than
      # returning an empty report when `repquota` is missing.
      #
      # This runner is where the `quota` module first meets a filesystem
      # that has quotas at all. This project's own fleet is entirely ZFS,
      # whose quotas are dataset properties these tools cannot see, so
      # nothing on it can exercise `setquota` or `repquota` -- the test
      # makes an ext4 filesystem in a file and mounts it through the loop
      # driver, which needs a whole virtual machine with root, which is
      # what a runner is.
      - name: install the quota tools
        run: sudo apt-get install -y --no-install-recommends quota

      # What this machine actually offers, printed whether or not the
      # tests then pass. A live check that fails is worth more when the
      # log says what it was looking at.
      # What this machine offers, printed whether or not the tests then
      # pass. A live check that fails is worth more when the log says
      # what it was looking at.
      - name: what this machine offers
        run: |
          echo "apparmor enabled: $(cat /sys/module/apparmor/parameters/enabled 2>&1)"
          echo "profiles loaded:  $(sudo grep -c . /sys/kernel/security/apparmor/profiles 2>&1)"
          echo "apparmor-utils:   $(dpkg-query -W -f='${Version}' apparmor-utils)"
          echo "tools:            $(command -v apparmor_parser aa-enforce aa-complain aa-disable | tr '\n' ' ')"
          echo "netplan:          $(dpkg-query -W -f='${Version}' netplan.io 2>&1)"
          echo "netplan files:    $(ls /etc/netplan 2>&1 | tr '\n' ' ')"
          echo "systemd:          $(systemctl --version | head -1)"
          echo "system bus:       $(test -S /run/dbus/system_bus_socket && echo present || echo missing)"
          echo "apt / dpkg:       $(apt-get --version | head -1) / $(dpkg --version | head -1)"
          echo "hello available:  $(apt-cache show hello >/dev/null 2>&1 && echo yes || echo no)"
          echo "quota tools:      $(dpkg-query -W -f='${Version}' quota 2>&1)"
          echo "repquota -O csv:  $(repquota -O csv -a >/dev/null 2>&1 && echo yes || echo no)"
          echo "loop driver:      $(test -e /dev/loop-control && echo present || echo missing)"

      # No workaround here, and that is the conclusion rather than a
      # gap.
      #
      # The `aa-*` tools are Python and parse every profile under
      # /etc/apparmor.d with their own parser before doing anything.
      # Ubuntu 24.04's apparmor-utils 4.0.1 cannot parse the profile set
      # Ubuntu itself ships: first a mount rule in `abstractions/passt`,
      # and with that one commented out, another one straight after. So
      # every `aa-*` invocation fails on every profile, including
      # /usr/bin/man.
      #
      # Two workarounds were tried and both are recorded in DIVERGENCE
      # 5.37 rather than kept: moving the file aside produced `Include
      # file not found` because other profiles include it, and commenting
      # out the offending rule produced the next unparseable rule. At
      # that point the workaround is the story, and the story is that
      # this platform's own tools do not work.
      #
      # The tests below say so and skip the mode changes. What keeps that
      # from being a silent pass is the release gate, which still refuses
      # to ship `apparmor` as demonstrated.

      # `sudo -E` alone loses PATH, and the toolchain setup-go installed
      # is on PATH rather than in a standard location -- so root would
      # run a different Go, or none. The environment is named
      # explicitly instead.
      - name: drive hostname, sysctl, apparmor, netplan, service, pkg and quota
        run: |
          sudo -E env "PATH=$PATH" HALITE_SYSTEM_LIVE=1             go test -count=1 -v -run 'TestLiveHostname|TestLiveSysctl|TestLiveAppArmor|TestLiveNetplan|TestLiveService|TestLivePkg|TestLiveQuota' ./internal/builtin/

      # Put back, for the same reason the tests restore what they touch:
      # the runner is thrown away, and a cleanup that only works because
      # nothing depends on it is one that stops working unnoticed.
      # The runner is thrown away, so this is not about the runner. It
      # is the assertion that the tests' own cleanup works, because they
      # are meant to be runnable on a real host and one that leaves a
      # machine renamed is one nobody runs twice.
      - name: the machine was put back
        if: always()
        run: |
          echo "hostname: $(hostname)"
          echo "swappiness: $(sysctl -n vm.swappiness)"
          echo "netplan files: $(ls /etc/netplan | tr '\n' ' ')"
          echo "probe unit: $(systemctl is-active halite-live-probe 2>&1)"
          echo "loop devices left attached: $(losetup -a | wc -l)"
          test "$(hostname)" != "halite-live-probe" || {
            echo "the tests left this machine renamed"; exit 1; }
          test ! -e /etc/netplan/98-halite-live-probe.yaml || {
            echo "the tests left the probe config in /etc/netplan"; exit 1; }
          test ! -e /run/systemd/system/halite-live-probe.service || {
            echo "the tests left the probe unit in /run/systemd/system"; exit 1; }

  # The same two modules on FreeBSD, which is the platform four of the
  # five hosts in this project's own fleet run.
  #
  # It is a different pair of branches rather than the same code on
  # another kernel: `hostname` reads and writes rc.conf through `sysrc`
  # here, and that branch had no test at all behind a fixture that looked
  # like one (plan.md 1.4). `sysctl` persists to /etc/sysctl.conf rather
  # than a drop-in, and `sysctlAssign` tries two spellings because BSD
  # and Linux disagree about `-w` -- which has never been checked on the
  # side that is not Linux.
  freebsd:
    name: freebsd (real kernel, sysrc)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start the virtual machine
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: freebsd
          version: '15.1'
          sync_files: runner-to-vm

      # Read out of go.mod rather than named here, for the reason ci.yml
      # gives: a workflow with its own version is a second source of
      # truth for something this project pins deliberately.
      - name: Install the pinned toolchain
        shell: cpa.sh {0}
        run: |
          set -e
          version=$(awk '/^toolchain /{print $2; exit}' go.mod)
          test -n "$version" || { echo "go.mod names no toolchain" >&2; exit 1; }
          mkdir -p "$HOME/toolchain"
          fetch -q -o /tmp/go.tar.gz "https://go.dev/dl/${version}.freebsd-amd64.tar.gz"
          tar -C "$HOME/toolchain" -xzf /tmp/go.tar.gz

      - name: drive hostname and sysctl
        shell: cpa.sh {0}
        run: |
          set -e
          export PATH="$HOME/toolchain/go/bin:$PATH"
          sudo -E env "PATH=$PATH" "HOME=$HOME" HALITE_SYSTEM_LIVE=1             go test -count=1 -v -run 'TestLiveHostname|TestLiveSysctl' ./internal/builtin/

      - name: the machine was put back
        shell: cpa.sh {0}
        if: always()
        run: |
          echo "hostname: $(hostname)"
          echo "rc.conf:  $(sysrc -n hostname 2>/dev/null || echo unset)"
          test "$(hostname)" != "halite-live-probe" || {
            echo "the tests left this machine renamed"; exit 1; }
