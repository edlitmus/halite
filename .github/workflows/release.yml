# SPEC 4.3's two-builder reproducibility check, on every tag.
#
# `make repro` builds twice on one machine from two paths, and its own
# comment is honest that this is not the property SPEC asks for. The
# property is that two *builders* produce byte-identical artifacts, and
# the only way to have it is to use two.
#
# What makes it possible at all is already in the Makefile: CGO_ENABLED=0
# so nothing links against a host library, -trimpath so no build path
# reaches the binary, GOFLAGS=-mod=vendor and GOPROXY=off so the inputs
# are the tree and nothing fetched, and SOURCE_DATE_EPOCH taken from the
# commit rather than from the clock. This job is what proves those hold
# rather than merely being written down.
#
# The two builders differ in the way that matters: a different runner
# image, and therefore a different filesystem layout, hostname,
# environment and kernel. They agree on the toolchain, because go.mod
# pins it -- a build that changed with the compiler would not be a
# reproducibility failure, it would be a different build.
name: Release

on:
  push:
    tags: ["v*"]
  # Run it without minting a tag.
  #
  # The reproducibility check -- the part of this workflow that is
  # expensive to be wrong about -- could previously only be exercised by
  # tagging, and a tag is not free: it is an object other people fetch,
  # it changes what `git describe` reports for everything downstream of
  # it, and its workflow run stays attached to the commit even after the
  # tag is deleted. Verifying a build should not require pretending to
  # release one.
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  # Nothing is built until this passes.
  #
  # A module that changes a machine as root and has never been run
  # against the tool it drives does not go into a release. Everything
  # else this build does about that informs somebody who is already
  # looking -- `doctor` warns, `sys.evidence` answers, a failing mutation
  # says so. A release reaches operators who are not looking: a fleet
  # upgrades and whatever shipped is running as root on every host in it.
  #
  # The gate can only ever stop a release, never cause a bad one, which
  # is why it is a gate and not a warning.
  gate:
    name: no unverified root-mutating module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false
      - run: make release-gate

  # On a tag, this waits for the gate and does not run if it failed. On a
  # manual run it proceeds either way -- and that is a narrower statement
  # than it looks, so it is worth being exact about.
  #
  # The gate refuses to *release* an unverified root-mutating module, and
  # nothing here publishes: this workflow builds and compares digests.
  # What a manual run answers is "do two builders agree", which is a
  # question about the build and not about what is fit to ship. Making it
  # unanswerable until ten macOS modules have been driven on a Mac would
  # tie a check on the build to work that has nothing to do with it.
  #
  # The gate still runs on a manual dispatch, and still reports. What it
  # does not do is stop a question it was not written to answer. A tag --
  # the only thing that is a release -- is unchanged: gate first, and
  # nothing is built if it fails.
  build:
    name: build (${{ matrix.builder }})
    needs: gate
    if: ${{ always() && (needs.gate.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        builder: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag itself is an input: version.Version comes from `git
          # describe` and SOURCE_DATE_EPOCH from the commit date. A
          # shallow clone answers both differently and the two builders
          # would disagree for a reason that is not the one being
          # tested.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # The toolchain version, not go.mod's `go` directive.
          #
          # `go-version-file: go.mod` reads the `go` line, which is a
          # floor -- 1.26.0 -- and not the `toolchain` line, which is the
          # pin. So every job installed 1.26.0 from this action's own
          # source and then fetched 1.26.6 from proxy.golang.org through
          # GOTOOLCHAIN=auto, over the network, uncached, before a line of
          # this repository compiled. Twelve jobs a push, each carrying a
          # dependency nothing needed: one of them died in setup-go's own
          # `go env GOPATH` when that fetch failed.
          #
          # Naming the pin here installs it directly and leaves
          # GOTOOLCHAIN=auto with nothing to download. internal/buildpolicy
          # holds this version to go.mod's `toolchain` directive in both
          # directions, so the two cannot drift.
          #
          # setup-go v6 began exporting GOTOOLCHAIN=local itself, which
          # collides with the workflow-level `auto` above. It does not
          # matter which of the two wins: the toolchain installed here
          # *is* the pin, so `auto` has nothing to fetch and `local` has
          # nothing to refuse. The one case they differ on is the pin
          # drifting below go.mod's -- `auto` would download and say
          # nothing, `local` would fail -- and buildpolicy already makes
          # that drift impossible.
          go-version: "1.26.6"
          cache: false

      # Both builders must compile with the same toolchain or they will
      # disagree for a reason that has nothing to do with
      # reproducibility. Asserted rather than assumed, because two
      # runner images are two chances to drift.
      - name: the runner's Go is the pinned toolchain
        run: .github/toolchain-check.sh

      # Vendored and offline, which is the point: the build must not be
      # able to fetch anything, so that what it produces depends on the
      # tree alone.
      #
      # `dist` rather than `release`: `make release` builds the three
      # binaries for the *host*, and this job used to compare those three
      # digests. A tag produces fifty-one artifacts across seventeen
      # targets, so that checked three of them, all for one platform --
      # and a cross-compile that was not reproducible for windows/arm64
      # could not have been caught by the job whose whole purpose is
      # catching it. `make dist` cross-compiles the lot and writes
      # dist/SHA256SUMS.
      - run: make dist

      - name: digests
        run: |
          cp dist/SHA256SUMS digests-${{ matrix.builder }}.txt
          echo "$(wc -l < digests-${{ matrix.builder }}.txt) artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.builder }}
          path: digests-${{ matrix.builder }}.txt
          if-no-files-found: error

      # The binaries themselves, briefly. The digests are what the compare
      # job holds equal and what the attestation names, but a digest
      # cannot be verified without the bytes it is a digest of, and
      # without them nobody can check an attestation against an artifact
      # or diff a build that did not reproduce elsewhere. Three days,
      # because this is a workflow artifact and not a release: publishing
      # is a separate step that does not exist yet.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.builder }}
          path: dist/
          retention-days: 3
          if-no-files-found: error

  compare:
    name: two builders agree
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true

      # Compared by digest rather than by artifact, because the question
      # is whether the bytes match and a diff of two manifests says
      # exactly which of the fifty-one did not.
      #
      # An empty or truncated manifest has to fail rather than compare
      # equal to another empty one: two builders that both produced
      # nothing agree, and that is the one way this check could pass
      # while testing nothing.
      - name: compare
        run: |
          set -e
          ls -l digests-*.txt
          a=digests-ubuntu-24.04.txt
          b=digests-ubuntu-22.04.txt
          # Seventeen targets in SPEC 27.1's list, three binaries each,
          # and one release archive per target (tools/disttar).
          expected=68
          for f in "$a" "$b"; do
            test -s "$f" || { echo "$f is missing or empty"; exit 1; }
            n=$(wc -l < "$f")
            if [ "$n" -lt "$expected" ]; then
              echo "$f lists $n artifacts, fewer than the $expected this build produces."
              echo "A short manifest would compare equal to another short one."
              exit 1
            fi
          done
          if diff -u "$a" "$b"; then
            echo "two builders produced identical binaries"
          else
            echo "REPRODUCIBILITY FAILURE: the two builders disagree"
            exit 1
          fi

  # SLSA build provenance for exactly the digests two builders agreed on.
  #
  # Keyless: the attestation is signed through Sigstore with this
  # workflow's own OIDC identity, so there is no long-lived key to keep or
  # to lose. That is the choice for now (SPEC 4.3, decided 2026-09-25); a
  # detached signature per artifact, which SPEC 4.3 also asks for, waits on
  # where a signing key would live, and no key belongs on a hosted runner.
  #
  # It attests the *manifest*, not files. `subject-checksums` takes the
  # SHA256SUMS the compare job has just held equal across both builders,
  # so the only digests given provenance are ones two independent builds
  # produced -- the reproducibility check is the precondition, not a
  # neighbouring job. No binary moves between jobs to do it.
  #
  # The gate is required here on every run, manual or not. A manual run
  # lets the build proceed past a failed gate because "do two builders
  # agree" is a question about the build (see the build job); an
  # attestation is a statement about an artifact meant to be used, and
  # the gate is what refuses one that is not fit to be.
  #
  # Verify an artifact with:
  #
  #   gh attestation verify halite-node-linux-amd64 --repo edlitmus/halite
  attest:
    name: provenance for what two builders agreed on
    needs: [gate, compare]
    if: ${{ needs.gate.result == 'success' && needs.compare.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: digests-ubuntu-24.04
      - name: the manifest the builders agreed on
        run: |
          set -e
          test -s digests-ubuntu-24.04.txt
          echo "$(wc -l < digests-ubuntu-24.04.txt) artifacts"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: digests-ubuntu-24.04.txt

  # Publish the release: the per-platform archives and SHA256SUMS, on a
  # tag, and only after the gate, the two-builder compare and the
  # provenance have all passed -- `attest` needs the first two, so
  # needing it is needing all three.
  #
  # The files published are the ones built, checked twice before they go:
  # this job's copy of SHA256SUMS must be byte-identical to the manifest
  # the compare job held equal, and every file must match its line in it.
  # A file that was built, uploaded and downloaded is three chances to
  # differ from what was attested, and this is where that is ruled out.
  #
  # A manual run does everything except publish: it checks the files and
  # prints what a tag would put in the release. That is how this job is
  # exercised without minting a tag.
  #
  # v0.* and any tag with a suffix (v1.0.0-rc1) are marked pre-release:
  # CHANGELOG.md says 1.0.0 is SPEC 32's phase 6, and the artifacts carry
  # provenance but no detached signature yet (SPEC 4.3).
  publish:
    name: publish the release
    needs: attest
    if: ${{ needs.attest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-ubuntu-24.04
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: digests-ubuntu-24.04
      - name: the files are the ones the builders agreed on
        run: |
          set -e
          cmp dist/SHA256SUMS digests-ubuntu-24.04.txt
          cd dist && sha256sum -c --quiet SHA256SUMS
          ls halite-*.tar.gz halite-*.zip | wc -l | xargs echo "archives:"
      - name: publish, on a tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -e
          version="${TAG#v}"
          cat > notes.md <<NOTES
          halite ${version}, for SPEC 27.1's seventeen platforms: one archive per
          platform (the BSD 2-Clause licence, binaries, example configuration,
          manual pages), and SHA256SUMS.

          Every archive and binary here was built twice, on two different runners,
          and published only because the two builds were byte-identical. Check a
          download, then its provenance:

              sha256sum --ignore-missing -c SHA256SUMS
              gh attestation verify halite-${version}-linux-amd64.tar.gz --repo ${GITHUB_REPOSITORY}

          The provenance is keyless SLSA, signed by this repository's release
          workflow through Sigstore. There is no detached signature yet (SPEC 4.3).
          SHA256SUMS also lists the bare binaries, which are inside the archives.
          Changes are in CHANGELOG.md.

          **What has and has not been demonstrated** is EVIDENCE.md, inside every
          archive: each module's evidence level and, for the ones short of
          *hardware*, what nobody has watched. It is generated from the same table
          the code answers "sys.evidence" and "doctor" from, so it cannot drift from
          what a node will tell you. It replaces the hand-written disclosure the
          proof of concept's notes carried, which nothing held to the code.
          NOTES
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          if [ "$IS_TAG" != "true" ]; then
            echo "not a tag ($GITHUB_REF): a tag would publish, with $prerelease:"
            ls -1 dist/halite-*.tar.gz dist/halite-*.zip dist/SHA256SUMS
            cat notes.md
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "halite ${version}" --notes-file notes.md $prerelease \
            dist/halite-*.tar.gz dist/halite-*.zip dist/SHA256SUMS
