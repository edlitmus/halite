# Defaults for `halite agent`, read from
# /usr/local/etc/halite/agent.conf (FreeBSD) or /etc/halite/agent.conf
# unless -config names another file.
#
# Every setting is a flag without its dash, so `halite agent -h` is the
# reference. A flag wins over this file, and $HALITE_MASTER and
# $HALITE_PKI win over the settings they correspond to.

# One control plane, or several comma-separated for failover: the agent
# prefers the first that answers and returns to it once it is back.
master: master.example.com

# The identity this agent enrolls as. Without it, the host grain is used.
# id: web1

pki: /usr/local/etc/halite/pki
cache: /var/cache/halite

# What the agent does on its own: watches that raise events, facts it
# publishes, and work it runs on its own clock.
beacons: /usr/local/etc/halite/beacons.sls
mine: /usr/local/etc/halite/mine.sls
schedule: /usr/local/etc/halite/schedule.sls

# Delay between reconnection and enrollment attempts.
# retry: 10s


# How much the agent says: error, warn, info, or debug.
# log-level: info

# Where it says it. Without this the log goes to stderr, which daemon(8)
# and journald already capture. SIGHUP reopens the file after a rotation.
# log-file: /var/log/halite/agent.log
