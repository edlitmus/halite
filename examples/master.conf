# Defaults for `halite master`, read from
# /usr/local/etc/halite/master.conf (FreeBSD) or /etc/halite/master.conf
# unless -config names another file.
#
# Every setting is a flag without its dash, so `halite master -h` is the
# reference. A flag on the command line wins over this file, and for the
# four settings that have one, so does the environment
# ($HALITE_ROOT, $HALITE_PILLAR_ROOT, $HALITE_PKI, $HALITE_MASTER).

addr: ":4506"
root: /usr/local/etc/halite/states
pillar-root: /usr/local/etc/halite/pillar
pki: /usr/local/etc/halite/pki

# Durable sinks for job results. A repeatable flag is a list here.
returner:
  - file:/var/log/halite/results.ndjson
  # - webhook:https://example.com/halite

# Rules turning events into jobs, and where orchestrations live.
reactor: /usr/local/etc/halite/reactor.sls
orch-root: /usr/local/etc/halite/orch

# Timing. The defaults are fine until a fleet says otherwise.
# poll-timeout: 30s
# orch-timeout: 30m
# orch-step-timeout: 10m

# What the one unauthenticated route may cost: requests per minute from a
# single source address, and how many may wait for an operator at once.
# Neither may be zero.
# enroll-rate: "60"
# max-pending: "512"

# Signing enrollment requests without an operator decision is for labs.
# auto-accept: "true"
